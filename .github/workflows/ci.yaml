---
name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Run shellcheck
        uses: ludeeus/action-shellcheck@master
        env:
          SHELLCHECK_OPTS: -s bash

      - name: Lint the add-on configuration
        uses: frenck/action-addon-linter@v2
        with:
          path: ./anydns

  build:
    name: Build ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        arch:
          - aarch64
          - amd64
          - armhf
          - armv7
          - i386
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      # --test builds the image without publishing it anywhere; the Supervisor
      # builds the add-on locally when it is installed.
      - name: Build the ${{ matrix.arch }} image
        uses: home-assistant/builder@master
        with:
          args: |
            --test \
            --${{ matrix.arch }} \
            --target /data/anydns \
            --addon
