---
configuration:
  accounts:
    name: DNS računi
    description: >-
      En vnos za vsak DuckDNS žeton. Vsakemu vnosu dodaj žeton in seznam domen,
      ki mu pripadajo, brez končnice .duckdns.org. Ime je neobvezno in se
      uporablja v dnevniku. Trenutno je podprt samo DuckDNS.
  ipv4:
    name: Naslov IPv4
    description: >-
      "auto" poišče javni naslov IPv4, prazna vrednost prepusti določitev
      DuckDNS-u (izvorni naslov zahteve), lahko pa vpišeš fiksni naslov.
  ipv6:
    name: Naslov IPv6
    description: >-
      Prazno pusti zapis AAAA pri miru, "auto" poišče javni naslov IPv6, lahko
      pa vpišeš fiksni naslov.
  seconds:
    name: Interval preverjanja
    description: >-
      Kako pogosto se preveri javni naslov, v sekundah (60 - 86400).
  skip_unchanged:
    name: Preskoči nespremenjene naslove
    description: >-
      Posodobitev na DuckDNS pošlji samo, kadar se je naslov res spremenil.
  update_on_start:
    name: Posodobi ob zagonu
    description: >-
      Takoj po zagonu dodatka enkrat posodobi vse račune, tudi če se naslov ni
      spremenil. Ponovni zagon dodatka tako vedno osveži DuckDNS.
  verify_dns:
    name: Preveri DNS zapise
    description: >-
      Za vsako domeno poglej, kam dejansko kaže, in primerjaj s trenutnim
      naslovom. Domena, ki kaže drugam ali se ne razreši, se posodobi tudi, če
      se na tej strani ni nič spremenilo.
  dns_server:
    name: DNS strežnik
    description: >-
      Strežnik za to poizvedbo, privzeto 1.1.1.1. Pusti prazno za uporabo
      razreševalnika v vsebniku.
  force_update_hours:
    name: Prisilna osvežitev
    description: >-
      Po toliko urah posodobi vse račune tudi, če se ni nič spremenilo, da
      domene ne potečejo. 0 izklopi prisilno osvežitev.
  log_level:
    name: Raven dnevnika
    description: >-
      Koliko podrobnosti se zapisuje v dnevnik. "info" beleži vse korake,
      "debug" doda še podrobnosti poizvedb.
